name: Arduino repository checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  repository-checks:
    name: Validate Arduino repository structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check sketch files and portable paths
        run: |
          python - <<'PY'
          import os
          import sys

          sketches = []
          invalid_paths = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d != ".git"]
              for name in dirs + files:
                  path = os.path.join(root, name)
                  if name != name.rstrip() or path != path.rstrip():
                      invalid_paths.append(path)
              for name in files:
                  if name.lower().endswith(".ino"):
                      sketches.append(os.path.join(root, name))

          if not sketches:
              print("No Arduino .ino sketches were found.")
              sys.exit(1)

          if invalid_paths:
              print("Paths with trailing whitespace are not portable:")
              for path in invalid_paths:
                  print(f" - {path}")
              sys.exit(1)

          print(f"Repository structure check passed; found {len(sketches)} Arduino sketch(es).")
          PY
